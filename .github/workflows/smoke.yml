# Checks that Reelmaker works on macOS and Windows on every push (GitHub runs this for free on public repos).
# It renders a real preview + export, runs speech-to-text (small model), and starts the web server.
name: Smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      REELMAKER_FW_MODEL: tiny        # small Whisper model, so the test doesn't download 1.6 GB
      REELMAKER_WHISPER: faster       # CI Macs have no usable GPU for MLX; test the faster-whisper path everywhere
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the PowerShell scripts parse (Windows PowerShell 5.1 and PowerShell 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $code = '$bad = 0; foreach ($f in "setup.ps1", "reelmaker.ps1") { $e = $null; [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$e) | Out-Null; if ($e) { $e | ForEach-Object { "$f : $($_.Message) (line $($_.Extent.StartLineNumber))" }; $bad = 1 } }; exit $bad'
          pwsh -NoProfile -Command $code
          if ($LASTEXITCODE) { exit 1 }
          powershell -NoProfile -Command $code
          if ($LASTEXITCODE) { exit 1 }

      - name: Install ffmpeg (with libass, for captions)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg-full; else choco install ffmpeg-full -y --no-progress; fi

      - name: Install Python packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ "$RUNNER_OS" = "macOS" ]; then python -m pip install faster-whisper==1.2.1; fi

      - name: Smoke test
        shell: bash
        run: python -m tests.smoke
